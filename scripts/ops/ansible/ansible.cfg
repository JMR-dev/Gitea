# The release engine's VM steps (ops.yml). Only scripts/ops/gitea_ops.py runs
# this: it installs the pinned ansible-core from requirements.txt, writes the
# one-host inventory (IAP tunnel, OS Login user, per-run known_hosts and
# ControlPath) and sets ANSIBLE_CONFIG to this file, ANSIBLE_HOME and
# ANSIBLE_LOCAL_TEMP to its own work directory. Not vm/ansible: that is the
# VM's configuration, and this is release code (scripts/cicd/release_gate.py).
[defaults]
# No facts: every step says exactly what it reads.
gathering = explicit
retry_files_enabled = False
interpreter_python = /usr/bin/python3
# Seconds to wait for the SSH connection itself, not for a step.
timeout = 30
nocows = True
# gitea_ops.py reads the result file ops.yml writes, never this output; it
# shows the output only when there is no result to read.
callback_result_format = yaml
deprecation_warnings = False

[ssh_connection]
# The module is piped to the VM's python, so nothing is written there first.
pipelining = True
# No pty, ever: a pty merges stderr into stdout and turns \n into \r\n, which
# would corrupt the digests and the TSV the steps print.
usetty = False
