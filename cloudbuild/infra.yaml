# Run Pulumi on the app stack (infra/), then push the refreshed VM
# configuration onto the instance -- with a backup before, status checks after,
# and a re-apply of the last good commit when they fail.
#
# The logic lives in scripts/cicd/infra_deploy.py, one process, so the lock,
# the backup, the guard and the rollback are ordinary code rather than a chain
# of steps passing markers. Pulumi uploads the vm/ tree as bucket objects; the
# config sync is what makes the VM pick them up, instead of the next reboot.
#
# _MODE=preview (pull requests) builds and previews and changes nothing.
# _MODE=up deploys; the CI launcher (cicd/pkg/triggers) sets it for main.

# build-status (cicd/relay) keys the Gitea commit status's context on these:
# pipeline-infra -> "cloudbuild/infra". gcloud builds submit has no tag flag, so
# they live here, not on the launcher's submit command (cicd/pkg/triggers).
tags: [gitea-pipeline, pipeline-infra]

substitutions:
  _REGION: us-east1
  _ZONE: us-east1-b
  _VM: gitea-vm
  _STACK: prod
  _APP_PROJECT: gitea-496920
  _MODE: preview
  _SHA: ""
  # The CI project's bucket for the deploy lock and the last-good commit.
  _DEPLOY_STATE_BUCKET: ""
  # A person approved this build (the gated trigger): replacing or deleting
  # the VM, a disk, a bucket, the cluster, an address or a DNS record is
  # allowed, and so is release code no drill has passed with.
  _APPROVED: "false"
  _GITEA_URL: https://gitea.jasonmross.dev
  _GITEA_REPO: JMR-dev/Gitea
  # `make ci-drill PIPELINE=infra` only.
  _DRILL: ""
  _DRILL_OK: ""

options:
  # A user-specified service account cannot write to the legacy default log
  # bucket.
  logging: CLOUD_LOGGING_ONLY
  # Compiling the program against pulumi-gcp is memory-hungry. The public
  # (default) build pool caps a build at 10 concurrent CPUs and offers no
  # high-memory types, so E2_HIGHCPU_8 (8 vCPU / 8 GB) is the most RAM available
  # here without a quota increase or a private pool.
  machineType: E2_HIGHCPU_8
  # gcloud builds submit is strict -- every declared substitution must be
  # referenced; ALLOW_LOOSE relaxes that. (automapSubstitutions is NOT set: a
  # build step that declares its own env: does not also receive the automapped
  # substitutions, so the deploy step lists the ones infra_deploy.py reads in
  # its env explicitly, below, which ${} expansion does reach.)
  substitutionOption: ALLOW_LOOSE

# Waiting for the lock (45 min), a deploy that creates the runner cluster
# (about 20 min), and a rollback that re-applies.
timeout: 10800s

availableSecrets:
  secretManager:
    - versionName: projects/${_APP_PROJECT}/secrets/pulumi-config-passphrase/versions/latest
      env: PULUMI_CONFIG_PASSPHRASE

steps:
  - id: deploy
    # Pinned by digest: Pulumi, Go, Python and gcloud in one image, which is
    # what one process doing all of it needs.
    name: pulumi/pulumi:3.266.0@sha256:d7ac1d7a8e502e784db4dd637f0d499ecdfef7f1bb81e8ece214c9b564361c59
    entrypoint: python3
    args: [scripts/cicd/infra_deploy.py, "${_MODE}"]
    secretEnv: [PULUMI_CONFIG_PASSPHRASE]
    # This step declares env:, so it does NOT receive automapSubstitutions.
    # infra_deploy.py reads all of its inputs from the environment, so list
    # every substitution it needs here; ${} expansion populates them.
    env:
      - _SHA=${_SHA}
      - _APP_PROJECT=${_APP_PROJECT}
      - _REGION=${_REGION}
      - _ZONE=${_ZONE}
      - _VM=${_VM}
      - _STACK=${_STACK}
      - _DEPLOY_STATE_BUCKET=${_DEPLOY_STATE_BUCKET}
      - _GITEA_URL=${_GITEA_URL}
      - _GITEA_REPO=${_GITEA_REPO}
      - _APPROVED=${_APPROVED}
      - _DRILL=${_DRILL}
      # launch_job.py annotates the engine Job with the commit (the engine
      # reads COMMIT_SHA); GITEA_DRILL_OK is the flag the engine refuses to run
      # a --drill without, set only by `make ci-drill` (_DRILL_OK=1). BUILD_ID
      # is a Cloud Build built-in that infra_deploy.py records in the manifest
      # and the drill attestation; without it the attestation name is "-local".
      - COMMIT_SHA=${_SHA}
      - GITEA_DRILL_OK=${_DRILL_OK}
      - BUILD_ID=${BUILD_ID}
      # Compiling pulumi-gcp from a cold cache is memory-heavy. The public build
      # pool caps a build at 10 CPUs, so the most RAM here is E2_HIGHCPU_8's
      # 8 GB. Compile one package at a time (-p=1) and GC aggressively (GOGC=30)
      # to keep the peak under 8 GB instead of thrashing into swap.
      - GOFLAGS=-p=1
      - GOGC=30
