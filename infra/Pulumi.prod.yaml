# Stack configuration for the `prod` stack.
#
# `pulumi config set --secret` is unnecessary here: every value is public
# infrastructure metadata. The Gitea application secrets live in Secret Manager
# and are never read by this program.
config:
  gcp:project: gitea-496920
  gcp:region: us-east1
  gitea:domain: gitea.jasonmross.dev
  # The Cloud DNS *resource* name of the existing managed zone, which is not
  # necessarily the DNS name. `gcloud dns managed-zones list` to find it.
  gitea:dnsZone: main
  # us-east1 has zones b, c and d -- there is no us-east1-a.
  gitea:zone: us-east1-b
  # e2-small: 2 shared vCPU, 2 GB RAM. See docs/runbook.md ("Memory on a 2 GB
  # instance") before adding anything else to this host.
  gitea:machineType: e2-small
  gitea:bootDiskGb: "20"
  gitea:dataDiskGb: "30"
  gitea:appName: Gitea
  # false | true | expensive. "expensive" keeps repo home pages, releases and
  # profiles public, but sends anonymous visitors to the login page for code,
  # history, source archives, issues, pull requests and wikis -- the pages AI
  # crawlers were hammering. Gitea calls this mode experimental. Clones and
  # release attachments are unaffected.
  gitea:requireSigninView: expensive
  gitea:podmanSubnet: 10.89.10.0/24
  # Coraza WAF: On | DetectionOnly | Off.
  # Start in DetectionOnly, review what it flags (docs/waf.md), then switch to
  # On. The fail2ban jail that bans on WAF verdicts follows this value.
  gitea:wafMode: DetectionOnly
  # Cloud Build source. The GitHub App installation id comes from the URL of the
  # app's settings page after you install it on the repository.
  gitea:githubOwner: JMR-dev
  gitea:githubRepo: Gitea
  gitea:githubAppInstallationId: "0"
  gitea:githubPatSecret: github-pat
  # Created by scripts/bootstrap.sh before the first `pulumi up`, because it is
  # the identity that runs Pulumi and therefore cannot be created by Pulumi.
  gitea:infraBuildServiceAccount: cb-infra@gitea-496920.iam.gserviceaccount.com

  # Gitea Actions runners on GKE -- see docs/runners.md. Leave off until
  # scripts/bootstrap.sh has been re-run: it creates the registration token
  # secret these depend on, and grants cb-infra@ roles/container.admin.
  gitea:runnersEnabled: "true"
  # Pinned. Must be a -dind-rootless tag; validated in infra/pkg/config.
  gitea:runnerImageTag: 5.1.0-dind-rootless
  # `runs-on: ubuntu-*` jobs each run as their own pod, up to runnerJobCapacity
  # at once across the cluster, and the node pool grows (up to runnerMaxNodes)
  # to fit them. Each job pod requests runnerJobCpu / runnerJobMemory; that
  # request is what the autoscaler packs nodes by. 0 removes the pod runner.
  gitea:runnerJobCapacity: "6"
  gitea:runnerJobCpu: 400m
  gitea:runnerJobMemory: 1536Mi
  # `runs-on: docker` jobs (docker build, Docker actions) run on the
  # Docker-in-Docker runner: one pod per node (pod anti-affinity), each running
  # up to runnerCapacity jobs at once.
  gitea:runnerReplicas: "1"
  gitea:runnerCapacity: "1"
  # Turning runners off cleanly starts with runnerReplicas AND runnerJobCapacity
  # at 0 -- that deletes the PVC disks. See docs/runners.md.
  gitea:runnerMachineType: e2-standard-2
  gitea:runnerMaxNodes: "3"
  # Spot: about a third of the price; a preempted job fails and is re-run.
  gitea:runnerSpot: "true"
