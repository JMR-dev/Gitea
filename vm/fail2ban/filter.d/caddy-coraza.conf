# Matches Coraza's BLOCKING DECISION on the Caddy log (LogDriver=journald).
#
# Written from real output, not documentation. Coraza emits two shapes:
#
#   Warning       -- one line per individual CRS rule that matched. A single
#                    one of these means almost nothing; a legitimate issue
#                    comment containing SQL will produce several.
#   Access denied -- emitted once, by the anomaly-score threshold rule (949110),
#                    when the accumulated score actually crosses the limit and
#                    the request is refused.
#
# Only the second is matched. Banning on individual rule hits would ban users
# for pasting a code snippet.
#
# Sample line this is built against:
#   {"level":"warn",...,"logger":"http.handlers.waf","msg":"[client \"203.0.113.9\"]
#    Coraza: Access denied (phase 2). Inbound Anomaly Score Exceeded (Total Score: 23)
#    [file \"@owasp_crs/REQUEST-949-BLOCKING-EVALUATION.conf\"] ... [id \"949110\"] ..."}
#
# NOTE: in DetectionOnly mode Coraza never emits "Access denied" -- nothing is
# refused -- so this filter matches nothing and the jail is inert. That is
# intentional and is why vm/bootstrap.sh only enables the jail when
# SecRuleEngine is On.

[Definition]

failregex = ^.*"logger":"http\.handlers\.waf".*\[client \\"<HOST>\\"\] Coraza: Access denied

ignoreregex =

datepattern = {^LN-BEG}
