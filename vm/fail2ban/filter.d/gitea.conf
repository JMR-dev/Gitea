# Matches Gitea authentication failures on stdout (LogDriver=journald), in two
# modes, one per jail (jail.d/gitea.local):
#
#   auth   (jail gitea)            a credential was offered and refused
#   probe  (jail gitea-ssh-probe)  an SSH connection ended before offering one
#
# The patterns below were taken from Gitea 28.2.0's real log output, not from
# documentation:
#
#   web sign-in:
#     routers/web/auth/auth.go:317:SignInPost() [W] Failed authentication attempt for someuser from 203.0.113.77:0: user does not exist [uid: 0, name: someuser]
#   built-in SSH server, once for every connection that fails before auth:
#     modules/ssh/ssh.go:257:sshConnectionFailed() [W] Failed connection from 198.51.100.9:48236 with error: <err>
#     modules/ssh/ssh.go:259:sshConnectionFailed() [W] Failed authentication attempt from 198.51.100.9:48236
#   and once per key offered that is not registered, even if a later key works:
#     modules/ssh/ssh.go:241:publicKeyHandler() [W] Unknown public key: SHA256:... from 198.51.100.9:48236
#     modules/ssh/ssh.go:242:publicKeyHandler() [W] Failed authentication attempt from 198.51.100.9:48236
#
# Neither SSH "Failed authentication attempt from" line is matched. Gitea
# writes the sshConnectionFailed one after every failed connection whatever
# the cause, so a single `ssh-keyscan` (five connections, one per key type)
# was a ban by itself. The publicKeyHandler one fires for each key an agent
# offers before the right one, so it would ban a user for running git.
#
# <err> is the error from x/crypto/ssh, and is what tells the modes apart. A
# bracketed list holds one entry per auth method the client tried. Every
# client tries "none" first, which is the "no auth passed yet" entry, so any
# other entry means a credential was offered:
#
#   [ssh: no auth passed yet, permission denied]   keys offered, all refused  auth
#   [ssh: password auth not configured]            a password was tried       auth
#   [ssh: no auth passed yet]                      asked which methods are    probe
#                                                  allowed, tried none: a
#                                                  client with no keys, or
#                                                  a bot enumerating them
#   EOF                                            hung up after the key      probe
#   ssh: no common algorithm for host key ...      exchange: ssh-keyscan, a   probe
#   read tcp ...: connection reset by peer         port scanner               probe
#
# The modes are complements: every failed connection counts in exactly one.
#
# Not seen at all: a wrong password or token on the REST API. Gitea logs that
# only as the request's 401, the same as an anonymous call to an endpoint that
# needs a login.
#
# <HOST> resolves to the real client ONLY because app.ini sets
# REVERSE_PROXY_TRUSTED_PROXIES to the podman subnet. Without it, Gitea logs
# Caddy's address and every web ban would hit the reverse proxy.

[Definition]

__ssh_failed = sshConnectionFailed\(\) \[W\] Failed connection from <HOST>(?::\d+)? with error:

# A bracketed list holding anything besides "ssh: no auth passed yet".
__offered = \[(?!(?:ssh: no auth passed yet(?:, )?)+\])

mdre-auth = ^.*Failed authentication attempt for .+? from <HOST>
            ^.*[Ii]nvalid credentials from <HOST>
            ^.*Attempted OAuth2 login .*? from <HOST>
            ^.*%(__ssh_failed)s %(__offered)s

mdre-probe = ^.*%(__ssh_failed)s (?!%(__offered)s)

failregex = <mdre-<mode>>

ignoreregex =

datepattern = {^LN-BEG}

[Init]
mode = auth
