# Matches Gitea authentication failures on stdout (LogDriver=journald).
#
# The patterns below were taken from real log output, not from documentation:
#
#   [W] Failed authentication attempt for someuser from 203.0.113.77:0: user does not exist
#   [W] Failed authentication attempt from 198.51.100.9:48236
#
# The first is the web UI / API; the second is the built-in SSH server. They
# share an auth path, which is why one jail covers both ports rather than
# guessing at separate per-transport formats.
#
# <HOST> resolves to the real client ONLY because app.ini sets
# REVERSE_PROXY_TRUSTED_PROXIES to the podman subnet. Without it, Gitea logs
# Caddy's address and every ban would hit the reverse proxy.
#
# Deliberately NOT matched: "Failed connection from <HOST> with error: EOF".
# Port scanners and health probes produce it constantly and it says nothing
# about credentials.

[Definition]

failregex = ^.*Failed authentication attempt for .+? from <HOST>
            ^.*Failed authentication attempt from <HOST>
            ^.*[Ii]nvalid credentials from <HOST>
            ^.*Attempted OAuth2 login .*? from <HOST>

ignoreregex =

datepattern = {^LN-BEG}
