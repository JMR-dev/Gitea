# The Gitea VM, from a blank AlmaLinux 10 image to serving. Idempotent: a run
# against a configured VM changes nothing (`make vm-check` shows what would).
#
# The config sources stay where vm/bootstrap.sh read them -- vm/config,
# vm/quadlets, vm/systemd, vm/nftables, vm/fail2ban, vm/dnf -- and the
# templates keep their ${VAR} syntax, rendered with ${ } as Jinja's variable
# delimiters, so the output is byte for byte what envsubst produced
# (tests/check proves it).
- name: Gitea VM
  hosts: gitea
  become: true
  vars:
    vm_src: "{{ playbook_dir }}/.."
  # tunnel and logship (the telemetry to watchtower) come last: after the
  # firewall's ruleset, which drops anything coming in over the tunnel, is
  # loaded (app's flush), and after Gitea and Caddy have their config, so their
  # slow first run (wireguard-tools, a 200 MiB image pull) never holds those
  # back. Their handlers are their own, and never restart Gitea or Caddy.
  roles:
    - preflight
    - base
    - data_disk
    - firewall
    - helpers
    - app
    - tunnel
    - logship

  # All the handlers live here, so they run in this order -- Ansible runs
  # notified handlers in definition order: units are reloaded before the
  # restarts, and Gitea restarts before Caddy, as the bash did.
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      listen: [units changed, gitea config changed]

    # Role base's persistent journal. Restarting journald keeps every
    # service's stdout stream (systemd holds them in its fd store), and the
    # flush moves what is in /run/log/journal to /var/log/journal.
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
      listen: journald config changed

    - name: Flush the journal to disk
      ansible.builtin.command: journalctl --flush
      changed_when: true
      listen: journald config changed

    # fail2ban's systemd backend opened its journal reader when only
    # /run/log/journal existed, and never picks up /var/log/journal: after the
    # two above, every jail would match nothing until fail2ban restarts. A real
    # restart, not a reload, which can keep the old reader. Its bans come back
    # from its own database. After the flush, so the reader opens the files the
    # journal now writes.
    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban.service
        state: restarted
      when: fail2ban_present | default(false) | bool
      listen: journald config changed

    - name: Restart gitea
      ansible.builtin.systemd_service:
        name: gitea.service
        state: restarted
      listen: gitea config changed

    - name: Restart caddy
      ansible.builtin.systemd_service:
        name: caddy.service
        state: restarted
      listen: gitea config changed

    # Never `systemctl reload` or `restart` nftables: on EL its ExecReload is
    # `nft 'flush ruleset; include ...'` and its ExecStop a bare `flush
    # ruleset`, which wipe netavark's DNAT rules and fail2ban's bans along with
    # ours (every container not restarted afterwards silently loses its
    # published ports). The file replaces exactly one table, so loading it is
    # the reload. infra_deploy.py refuses a playbook that restarts the unit.
    - name: Load nftables
      ansible.builtin.command: nft -f /etc/sysconfig/nftables.conf
      changed_when: true
      notify: Check gitea_filter

    - name: Check gitea_filter
      ansible.builtin.command: nft list table inet gitea_filter
      changed_when: false

    - name: Reload fail2ban
      ansible.builtin.shell: systemctl reload fail2ban || systemctl restart fail2ban
      changed_when: true

    # The telemetry's own (roles tunnel and logship), listened for under names
    # nothing of Gitea's or Caddy's notifies. Restart, not `wg syncconf`: a
    # changed Address or Endpoint needs wg-quick. Warn-only, like the rest of
    # the telemetry: role logship's deploy check says whether it came up. Not
    # under --check, where a first deploy has no unit to restart.
    - name: Restart the watchtower tunnel
      ansible.builtin.systemd_service:
        name: wg-quick@wg-watchtower.service
        state: restarted
      failed_when: false
      when:
        - tunnel_state | default('') == 'up'
        - not ansible_check_mode
      listen: watchtower tunnel changed

    # Also on a tunnel change, so Alloy reconnects at once rather than after
    # its backoff.
    - name: Restart alloy
      ansible.builtin.systemd_service:
        name: alloy.service
        state: restarted
        daemon_reload: true
      failed_when: false
      when:
        - tunnel_state | default('') == 'up'
        - not ansible_check_mode
      listen: [watchtower tunnel changed, alloy changed]
