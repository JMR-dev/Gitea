# Gitea and Caddy: images, config (app.ini and the Caddyfile through
# files/gitea-render-secrets), quadlets, units and timers. Any change to them
# restarts both, Gitea first, as vm/bootstrap.sh's render_all did.
- name: Config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: [/etc/gitea, /etc/caddy, /etc/containers/systemd]

# Coraza's audit log (the Caddyfile's SecAuditLog) holds whole requests, so it
# stays on this host, in a directory only Caddy's user (1000, the image's and
# the quadlet's) can read, relabelled for the container by the quadlet's :Z,
# and rotated by logrotate. Never the journal, which role logship ships. Before
# the Caddyfile and the quadlet, so Caddy never restarts without it.
- name: Caddy's audit log directory
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Rotate the audit log
  ansible.builtin.copy:
    src: "{{ vm_src }}/logrotate/coraza-audit"
    dest: /etc/logrotate.d/coraza-audit
    mode: "0644"

- name: logrotate runs daily
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started

# Pulled here, on a VM that has neither: Gitea's so that app.ini's render
# below can generate a missing Gitea secret with it (files/gitea-render-secrets)
# on the very first pass, and Caddy's so that a registry or credential failure
# shows here, as this task's error, not as caddy.service failing to start at
# the end of the run. Normally the quadlets and podman-auto-update pull.
- name: Images present?
  ansible.builtin.command: podman image exists {{ item }}
  loop: ["{{ image_gitea }}", "{{ image_caddy }}"]
  register: images
  changed_when: false
  failed_when: false
  check_mode: false

- name: Artifact Registry credentials, to pull
  ansible.builtin.command: /usr/local/bin/gitea-ar-auth
  when: images.results | selectattr('rc', '!=', 0) | list | length > 0

- name: Pull the images
  ansible.builtin.command: podman pull --quiet --authfile /etc/containers/ar-auth.json {{ item.item }}
  loop: "{{ images.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: Runner registration token
  ansible.builtin.script:
    cmd: gitea-render-secrets {{ '--check' if ansible_check_mode else '' }} runner-token {{ gcp_project }} {{ secret_prefix }}
  register: runner_token
  changed_when: runner_token.stdout_lines[0] in ['changed', 'would-change']
  check_mode: false
  notify: gitea config changed

- name: Whether Gitea gets it
  ansible.builtin.set_fact:
    runner_token_present: "{{ runner_token.stdout_lines[1] == 'present' }}"

- name: app.ini
  ansible.builtin.script:
    cmd: >-
      gitea-render-secrets {{ '--check' if ansible_check_mode else '' }}
      app-ini {{ gcp_project }} {{ secret_prefix }} {{ image_gitea }}
  environment:
    GITEA_RENDER_INPUT: >-
      {{ lookup('ansible.builtin.template', vm_src + '/config/app.ini.tmpl',
                variable_start_string='${', variable_end_string='}') }}
  register: app_ini
  changed_when: app_ini.stdout_lines[0] in ['changed', 'would-change']
  check_mode: false
  notify: gitea config changed

- name: app.ini diff (secrets masked)
  ansible.builtin.debug:
    msg: "{{ app_ini.stdout_lines[1:] }}"
  when: app_ini is changed and ansible_diff_mode

- name: Caddyfile
  ansible.builtin.script:
    cmd: gitea-render-secrets {{ '--check' if ansible_check_mode else '' }} caddyfile {{ gcp_project }} {{ secret_prefix }}
  environment:
    GITEA_RENDER_INPUT: >-
      {{ lookup('ansible.builtin.template', vm_src + '/config/Caddyfile.tmpl',
                variable_start_string='${', variable_end_string='}') }}
  register: caddyfile
  changed_when: caddyfile.stdout_lines[0] in ['changed', 'would-change']
  check_mode: false
  notify: gitea config changed

- name: Caddyfile diff (contact masked)
  ansible.builtin.debug:
    msg: "{{ caddyfile.stdout_lines[1:] }}"
  when: caddyfile is changed and ansible_diff_mode

# Gitea and Caddy have fixed addresses on the gitea network
# (vars/main.yml). One that a running container holds can't be taken, and
# until they had them, podman handed both out in turn, so either may hold the
# other's now. When either is about to change address, Caddy stops before the
# restarts below (site.yml's handlers), which then start Gitea, then Caddy,
# each on its own address. Read before the quadlets change; a container that
# isn't running holds nothing.
- name: The containers' addresses now
  ansible.builtin.command:
    argv: [podman, container, inspect, "{{ item }}"]
  loop: [gitea, caddy]
  register: app_addresses
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop Caddy first if either is changing address
  ansible.builtin.debug:
    msg: "{{ item.item }} holds {{ app_held }} on the gitea network, not {{ app_wanted }}: Caddy stops before the restarts"
  loop: "{{ app_addresses.results }}"
  loop_control:
    label: "{{ item.item }}"
  vars:
    app_held: >-
      {{ (item.stdout | from_json | first).NetworkSettings.Networks.gitea.IPAddress | default('')
         if item.rc == 0 and item.stdout | length > 0 else '' }}
    app_wanted: "{{ GITEA_ADDRESS if item.item == 'gitea' else CADDY_ADDRESS }}"
  when:
    - app_held | length > 0
    - app_held != app_wanted
  changed_when: true
  notify: container addresses changed

- name: Quadlets
  ansible.builtin.template:
    src: "{{ vm_src }}/quadlets/{{ item }}"
    dest: /etc/containers/systemd/{{ item }}
    mode: "0644"
    variable_start_string: "${"
    variable_end_string: "}"
  loop: [gitea.network, gitea.container, caddy.container, caddy-data.volume, caddy-config.volume]
  notify: gitea config changed

- name: Units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item | basename }}
    mode: "0644"
  with_fileglob: "{{ vm_src }}/systemd/*"
  notify: gitea config changed

# What vm/bootstrap.sh left behind: its config-sync unit, the copy of itself
# that unit ran, and the copy of vm/ it pulled from the config bucket.
- name: Remove the bash config path
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/gitea-config-sync.service
    - /usr/local/sbin/gitea-bootstrap
    - /opt/gitea-config
  notify: units changed

- name: Timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [gitea-ar-auth.timer, gitea-backup.timer, gitea-reboot-window.timer]

- name: Restart what changed
  ansible.builtin.meta: flush_handlers

# Quadlet units are generated at daemon-reload and started at boot by their
# [Install] section; they cannot be `enabled`. Starting gitea blocks until its
# health check passes (Notify=healthy).
- name: Gitea and Caddy running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop: [gitea.service, caddy.service]
