# Ansible for the Gitea VM. Run it through `make vm-check` / `make vm-apply`
# (scripts/cicd/infra_deploy.py), which install the pinned ansible-core from
# requirements.txt, register an OS Login key and set the GITEA_* variables
# inventory.yml reads. A deploy runs it after every `pulumi up`.
[defaults]
inventory = inventory.yml
roles_path = roles
# No fact gathering: the only facts the play needs are the instance
# metadata, read by the preflight role.
gathering = explicit
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# One host. A failure anywhere stops the run; handlers that were notified
# before it still run, so a changed file is never left without its restart.
any_errors_fatal = True
force_handlers = True
nocows = True
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# No pty: it would merge stderr into stdout.
usetty = False
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
