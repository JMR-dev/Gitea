# The WAF only detecting (jail off), no runner token, no runner-egress-ip, an
# app name with a space, no backup bucket, no ACME contact, and another
# project and podman subnet. Until Caddy's host-network mode was retired, this
# was host-detection, with Caddy on the host network.
app_name: Our Gitea
domain: git.example.test
require_signin_view: "false"
waf_mode: DetectionOnly
gcp_project: other-project
image_gitea: us-central1-docker.pkg.dev/other-project/gitea/gitea:prod
image_caddy: us-central1-docker.pkg.dev/other-project/gitea/caddy:prod
podman_subnet: 10.89.20.0/24
podman_gateway: 10.89.20.1
runner_egress_ip: ""
backup_bucket: ""
runner_token_present: false
# A dummy watchtower peer, as in bridge-on.
watchtower_peer_secret: projects/example-observe/secrets/wireguard-example-peer
logship_journal_gid: "190"
secrets:
  GITEA_SECRET_KEY: k2
  GITEA_INTERNAL_TOKEN: t2
  GITEA_OAUTH2_JWT_SECRET: o2
  GITEA_LFS_JWT_SECRET: l2
  CADDY_EMAIL: "# no ACME contact address: secret gitea-acme-email was unreadable at render time"
