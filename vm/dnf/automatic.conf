# Installed by vm/bootstrap.sh as /etc/dnf/automatic.conf.
# Consumed by dnf5-automatic.timer (dnf-automatic.timer on a dnf4 system).

[commands]
# `default` follows the distro's notion of what an upgrade is; switch to
# `security` if you want to narrow the blast radius of unattended patching.
upgrade_type = default

# Spread the herd. Every AlmaLinux box on the internet firing at 03:30 is how
# mirrors fall over.
random_sleep = 3600

network_online_timeout = 60
download_updates = yes
apply_updates = yes

# Never reboot from here. gitea-reboot-window.timer owns that decision, so
# restarts land in a known window with a fresh disk snapshot behind them.
reboot = never

[emitters]
# stdio -> journald -> Cloud Logging. No mail configured on this host.
emit_via = stdio
system_name = gitea-vm

[base]
debuglevel = 1
